name: 发布 GitHub Pages

on:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: 构建静态站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 配置 GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 同步上游源
        run: npm run sync:source

      - name: 校验译文
        run: npm run validate

      - name: 构建站点
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    name: 部署 GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v5
