server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(css|js|ico|svg|png|jpg|jpeg|gif|webp|woff|woff2)$ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public";
  }
}
